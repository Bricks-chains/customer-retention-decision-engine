<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Customer retention core churn insights</title>
  <desc id="desc">Churn is highest for month-to-month contracts, electronic check payments, and customers with zero to six months tenure.</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">Customer retention: core churn insights</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">IBM Telco Customer Churn dataset · 7,043 customers</text>

  <text x="40" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Churn rate by contract</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <text x="40" y="165">Month-to-month</text><rect x="165" y="151" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="151" width="256" height="22" fill="#4472C4"/><text x="440" y="168">42.7%</text>
    <text x="40" y="205">One year</text><rect x="165" y="191" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="191" width="68" height="22" fill="#4472C4"/><text x="440" y="208">11.3%</text>
    <text x="40" y="245">Two year</text><rect x="165" y="231" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="231" width="17" height="22" fill="#4472C4"/><text x="440" y="248">2.8%</text>
  </g>

  <text x="540" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Churn rate by payment method</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <text x="540" y="165">Electronic check</text><rect x="690" y="151" width="220" height="22" fill="#e5e7eb"/><rect x="690" y="151" width="220" height="22" fill="#ED7D31"/><text x="925" y="168">45.3%</text>
    <text x="540" y="205">Mailed check</text><rect x="690" y="191" width="220" height="22" fill="#e5e7eb"/><rect x="690" y="191" width="93" height="22" fill="#ED7D31"/><text x="925" y="208">19.1%</text>
    <text x="540" y="245">Bank transfer</text><rect x="690" y="231" width="220" height="22" fill="#e5e7eb"/><rect x="690" y="231" width="81" height="22" fill="#ED7D31"/><text x="925" y="248">16.7%</text>
    <text x="540" y="285">Credit card</text><rect x="690" y="271" width="220" height="22" fill="#e5e7eb"/><rect x="690" y="271" width="74" height="22" fill="#ED7D31"/><text x="925" y="288">15.2%</text>
  </g>

  <text x="40" y="335" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Churn declines with tenure</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <text x="40" y="375">0-6 months</text><rect x="165" y="361" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="361" width="260" height="22" fill="#70AD47"/><text x="440" y="378">52.9%</text>
    <text x="40" y="415">7-12 months</text><rect x="165" y="401" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="401" width="176" height="22" fill="#70AD47"/><text x="440" y="418">35.9%</text>
    <text x="40" y="455">13-24 months</text><rect x="165" y="441" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="441" width="140" height="22" fill="#70AD47"/><text x="440" y="458">28.7%</text>
    <text x="40" y="495">25-48 months</text><rect x="165" y="481" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="481" width="100" height="22" fill="#70AD47"/><text x="440" y="498">20.4%</text>
    <text x="40" y="535">49-72 months</text><rect x="165" y="521" width="260" height="22" fill="#e5e7eb"/><rect x="165" y="521" width="47" height="22" fill="#70AD47"/><text x="440" y="538">9.5%</text>
  </g>

  <text x="540" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Validated model signals</text>
  <g font-family="Arial, sans-serif" fill="#374151">
    <text x="540" y="410" font-size="16">ROC-AUC</text><text x="820" y="410" font-size="22" font-weight="700">0.833</text>
    <text x="540" y="455" font-size="16">PR-AUC</text><text x="820" y="455" font-size="22" font-weight="700">0.656</text>
    <text x="540" y="500" font-size="16">Priority-save queue</text><text x="820" y="500" font-size="22" font-weight="700">125</text>
    <text x="540" y="545" font-size="14" fill="#6b7280">Highest-risk focus: new, month-to-month customers</text>
  </g>
</svg>
